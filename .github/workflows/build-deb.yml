name: Build InfiltratorOS DEB

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install package build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev

      - name: Determine package version
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Release tag does not match VERSION." >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"

      - name: Build package
        shell: bash
        run: |
          VERSION="$VERSION" bash scripts/build-deb.sh

      - name: Inspect package
        shell: bash
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: infiltratoros-${{ env.VERSION }}
          path: dist/*.deb
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset="infiltratoros_${VERSION}_amd64.deb"
          test "$(dpkg-deb -f "dist/$asset" Package)" = infiltratoros
          test "$(dpkg-deb -f "dist/$asset" Version)" = "$VERSION"
          test "$(dpkg-deb -f "dist/$asset" Architecture)" = amd64

          git fetch origin --tags
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$GITHUB_SHA" || {
              echo "Release tag already identifies a different source revision." >&2
              exit 1
            }
          else
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "$RELEASE_TAG"
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            target=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.target_commitish')
            test "$target" = "$GITHUB_SHA"
            actual=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
            test "$actual" = "$asset"
            echo "Release $RELEASE_TAG already exists for this exact source; preserving its published asset."
          else
            gh release create "$RELEASE_TAG" "dist/$asset" \
              --verify-tag \
              --target "$GITHUB_SHA" \
              --title "InfiltratorOS $RELEASE_TAG" \
              --generate-notes
          fi
