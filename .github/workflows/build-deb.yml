name: Build InfiltratorOS DEB
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: os-package-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          submodules: true
      - name: Install build dependencies
        run: |
          printf '%s\n' 'Dir::Etc::sourcelist "/etc/apt/sources.list.d/ubuntu.sources";' 'Dir::Etc::sourceparts "-";' | sudo tee /etc/apt/apt.conf.d/99-infiltrator-ci-sources >/dev/null
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y dpkg-repack pkg-config libgtk-3-dev libcurl4-openssl-dev libjson-c-dev libssl-dev wget fontconfig ccache
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: os-ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            os-ccache-${{ runner.os }}-${{ runner.arch }}-
      - name: Build package once
        env:
          CCACHE_DIR: /home/runner/.cache/ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/build-deb.sh
          ccache --show-stats
          version=$(tr -d '\r\n' < VERSION)
          (cd dist && sha256sum "infiltratoros_${version}_amd64.deb" > SHA256SUMS.txt)
      - name: Publish build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA" || exit 0
          version=$(tr -d '\r\n' < VERSION)
          tag="v$version"
          existing=$(git rev-parse -q --verify "refs/tags/$tag^{commit}" || true)
          if [[ -n $existing && $existing != "$GITHUB_SHA" ]]; then
            echo "$tag belongs to a previous commit; retaining it."
            exit 0
          fi
          if gh release view "$tag" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/release-state" 2>/dev/null; then
            if [[ "$(cat "$RUNNER_TEMP/release-state")" == true ]]; then
              gh release upload "$tag" "dist/infiltratoros_${version}_amd64.deb" dist/SHA256SUMS.txt --clobber
              gh release edit "$tag" --draft=false --latest
            fi
          else
            gh release create "$tag" "dist/infiltratoros_${version}_amd64.deb" dist/SHA256SUMS.txt --target "$GITHUB_SHA" --title "InfiltratorOS $version" --generate-notes
          fi
