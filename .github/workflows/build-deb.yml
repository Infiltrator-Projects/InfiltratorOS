name: Build InfiltratorOS DEB
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: os-package-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libgtk-3-dev wget fontconfig
      - name: Exercise production process and status contracts
        run: sh tests/check.sh
      - name: Build and prove reproducible package bytes
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/build-deb.sh
          cp dist/*.deb "$RUNNER_TEMP/first.deb"
          sh scripts/build-deb.sh
          cmp "$RUNNER_TEMP/first.deb" dist/*.deb
          version=$(tr -d '\r\n' < VERSION)
          test "$(dpkg-deb -f dist/*.deb Version)" = "$version"
          dpkg-deb -e dist/*.deb "$RUNNER_TEMP/control"
          sh -n "$RUNNER_TEMP/control/postinst" "$RUNNER_TEMP/control/prerm"
          dpkg-deb -x dist/*.deb "$RUNNER_TEMP/payload"
          cmp assets/infiltratoros.png "$RUNNER_TEMP/payload/usr/share/plymouth/themes/infiltratoros/infiltratoros.png"
          test -d "$RUNNER_TEMP/payload/usr/lib/infiltrator/temporal/calendars"
          test -d "$RUNNER_TEMP/payload/usr/lib/infiltrator/temporal/clocks"
          test -f "$RUNNER_TEMP/payload/etc/profile.d/90-infiltratoros-native-path.sh"
          sh -n "$RUNNER_TEMP/payload/etc/profile.d/90-infiltratoros-native-path.sh"
          test ! -e "$RUNNER_TEMP/payload/System/Programs"
          for directory in \
            System \
            System/Commands \
            System/Libraries \
            System/Devices \
            System/Filesystems \
            System/Kernel \
            System/Kernel/Images \
            System/Kernel/Modules \
            System/Kernel/Firmware \
            System/Resources \
            System/Resources/Calendars \
            System/Resources/Clocks \
            System/Resources/Fonts \
            System/Resources/Locales \
            System/Resources/Icons \
            System/Resources/Themes \
            System/Preferences \
            Programs \
            Users \
            Volumes \
            Temporary; do
            test -d "$RUNNER_TEMP/payload/$directory"
          done
          font_root="$RUNNER_TEMP/payload/System/Resources/Fonts"
          test "$(find "$font_root" -maxdepth 1 -type f -name '*.ttf' | wc -l)" -eq 0
          font_seed="$RUNNER_TEMP/payload/usr/lib/infiltratoros/font-seed"
          test "$(find "$font_seed" -maxdepth 1 -type f -name '*.ttf' | wc -l)" -eq 3
          cmp assets/fonts/mb_corpo_a_cond_regular.ttf "$font_seed/mb_corpo_a_cond_regular.ttf"
          cmp assets/fonts/mb_corpo_s_bold.ttf "$font_seed/mb_corpo_s_bold.ttf"
          cmp assets/fonts/mb_corpo_s_regular.ttf "$font_seed/mb_corpo_s_regular.ttf"
          printf '%s  %s\n' c8bcd7e1a7d71169b38491d9b7c1ffe7ba7b46e888f0c1219931343a47bc0e05 "$font_seed/mb_corpo_a_cond_regular.ttf" | sha256sum -c -
          printf '%s  %s\n' d37ea986e2344d83390f94f170e6272b56efd00bfec808afe8314c4ca45d43b4 "$font_seed/mb_corpo_s_bold.ttf" | sha256sum -c -
          printf '%s  %s\n' 94ede6629443c03d4362dcef425fb3ff520be5d654370021a34e81286804465c "$font_seed/mb_corpo_s_regular.ttf" | sha256sum -c -
          helper="$RUNNER_TEMP/payload/usr/lib/infiltratoros/ensure-native-fonts"
          test -x "$helper"
          sh -n "$helper"
          ! grep -Eq 'raw\.githubusercontent\.com|MBLink|curl|wget' "$helper"
          ! grep -Eq '(rm|rmdir).*System/Resources/Fonts' "$RUNNER_TEMP/control/postinst" "$RUNNER_TEMP/control/prerm"
          native_root="$RUNNER_TEMP/native-root"
          INFILTRATR_NATIVE_ROOT="$native_root" INFILTRATR_FONT_SOURCE_DIR="$font_seed" "$helper"
          staged_fonts="$native_root/System/Resources/Fonts"
          printf '%s  %s\n' c8bcd7e1a7d71169b38491d9b7c1ffe7ba7b46e888f0c1219931343a47bc0e05 "$staged_fonts/mb_corpo_a_cond_regular.ttf" | sha256sum -c -
          printf '%s  %s\n' d37ea986e2344d83390f94f170e6272b56efd00bfec808afe8314c4ca45d43b4 "$staged_fonts/mb_corpo_s_bold.ttf" | sha256sum -c -
          printf '%s  %s\n' 94ede6629443c03d4362dcef425fb3ff520be5d654370021a34e81286804465c "$staged_fonts/mb_corpo_s_regular.ttf" | sha256sum -c -
          grep -Fq '<dir>/System/Resources/Fonts</dir>' "$native_root/etc/fonts/conf.d/90-infiltrator-native-fonts.conf"
          INFILTRATR_NATIVE_ROOT="$native_root" INFILTRATR_FONT_SOURCE_DIR="$RUNNER_TEMP/does-not-exist" "$helper"
          for product in system-monitor calculator; do
            for program in "install-$product" "start-$product-install" "$product-progress"; do
              test -x "$RUNNER_TEMP/payload/usr/lib/infiltratoros/$program"
            done
          done
          git archive --format=zip --prefix="infiltratoros-$version/" HEAD > "dist/infiltratoros-$version-source.zip"
          printf '%s\n' "$GITHUB_SHA" > dist/SOURCE_COMMIT
          (cd dist && sha256sum *.deb *.zip SOURCE_COMMIT > SHA256SUMS.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: os-qualified-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: os-qualified-${{ github.sha }}
          path: release
      - name: Publish exact qualified bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA" || exit 0
          test "$(cat release/SOURCE_COMMIT)" = "$GITHUB_SHA"
          (cd release && sha256sum -c SHA256SUMS.txt)
          version=$(tr -d '\r\n' < VERSION)
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag^{commit}" >/dev/null; then
            if [[ "$(git rev-parse "$tag^{commit}")" != "$GITHUB_SHA" ]]; then
              gh release view "$tag" --json isDraft --jq '.isDraft' | grep -qx false
              echo "$tag is already published; advance VERSION for the next product release."
              exit 0
            fi
          else
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi
          if ! gh release view "$tag" --json isDraft > "$RUNNER_TEMP/release-state"; then
            gh release create "$tag" --verify-tag --draft --title "InfiltratorOS $version" --generate-notes
            gh release view "$tag" --json isDraft > "$RUNNER_TEMP/release-state"
          fi
          draft=$(jq -r .isDraft "$RUNNER_TEMP/release-state")
          if [[ "$draft" == true ]]; then
            gh release upload "$tag" release/* --clobber
          fi
          verify_remote() {
            local destination
            destination=$(mktemp -d)
            gh release download "$tag" --dir "$destination"
            diff -qr release "$destination"
            rm -rf "$destination"
          }
          verify_remote
          if [[ "$draft" == true ]]; then
            gh release edit "$tag" --draft=false --latest
          fi
          verify_remote
          git fetch origin "refs/tags/$tag:refs/tags/$tag"
          test "$(git rev-parse "$tag^{commit}")" = "$GITHUB_SHA"
