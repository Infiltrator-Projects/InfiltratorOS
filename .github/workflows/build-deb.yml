name: Build InfiltratorOS DEB
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: os-package-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          submodules: true
      - name: Install build dependencies
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test -s /etc/apt/sources.list.d/ubuntu.sources
          printf '%s\n' 'Dir::Etc::sourcelist "/etc/apt/sources.list.d/ubuntu.sources";' 'Dir::Etc::sourceparts "-";' | sudo tee /etc/apt/apt.conf.d/99-infiltrator-ci-sources >/dev/null
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y dpkg-repack pkg-config libgtk-3-dev libcurl4-openssl-dev libjson-c-dev libssl-dev wget fontconfig zip
      - name: Build package once
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/build-deb.sh
          version=$(tr -d '\r\n' < VERSION)
          test "$(dpkg-deb -f dist/*.deb Version)" = "$version"
          # Source archive includes the exact pinned Common sources.
          archive_root="$RUNNER_TEMP/infiltratoros-$version"
          mkdir -p "$archive_root/src/infiltratr-common"
          git archive HEAD | tar -xf - -C "$archive_root"
          git -C src/infiltratr-common archive HEAD |
            tar -xf - -C "$archive_root/src/infiltratr-common"
          (cd "$RUNNER_TEMP" && zip -qr "$GITHUB_WORKSPACE/dist/infiltratoros-$version-source.zip" "infiltratoros-$version")
          printf '%s\n' "$GITHUB_SHA" > dist/SOURCE_COMMIT
          (cd dist && sha256sum *.deb *.zip SOURCE_COMMIT > SHA256SUMS.txt)
      - name: Publish build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA" || exit 0
          test "$(cat dist/SOURCE_COMMIT)" = "$GITHUB_SHA"
          (cd dist && sha256sum -c SHA256SUMS.txt)
          version=$(tr -d '\r\n' < VERSION)
          tag="v$version"
          # An immutable previous release cannot be updated by this commit.
          # Exit before waiting for dependencies rather than holding a job
          # for hours when a version bump is required anyway.
          existing=$(git rev-parse -q --verify "refs/tags/$tag^{commit}" || true)
          if [[ -n $existing && $existing != "$GITHUB_SHA" ]]; then
            gh release view "$tag" --json isDraft --jq '.isDraft' | grep -qx false
            echo "$tag is already published; advance VERSION for the next product release."
            exit 0
          fi
          if git rev-parse -q --verify "refs/tags/$tag^{commit}" >/dev/null; then
            if [[ "$(git rev-parse "$tag^{commit}")" != "$GITHUB_SHA" ]]; then
              gh release view "$tag" --json isDraft --jq '.isDraft' | grep -qx false
              echo "$tag is already published; advance VERSION for the next product release."
              exit 0
            fi
          else
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi
          if ! gh release view "$tag" --json isDraft > "$RUNNER_TEMP/release-state"; then
            gh release create "$tag" --verify-tag --draft --title "InfiltratorOS $version" --generate-notes
            gh release view "$tag" --json isDraft > "$RUNNER_TEMP/release-state"
          fi
          draft=$(jq -r .isDraft "$RUNNER_TEMP/release-state")
          if [[ "$draft" == true ]]; then
            gh release upload "$tag" dist/* --clobber
          fi
          verify_remote() {
            local destination
            destination=$(mktemp -d)
            gh release download "$tag" --dir "$destination"
            diff -qr dist "$destination"
            rm -rf "$destination"
          }
          verify_remote
          if [[ "$draft" == true ]]; then
            gh release edit "$tag" --draft=false --latest
          fi
          verify_remote
          git fetch origin "refs/tags/$tag:refs/tags/$tag"
          test "$(git rev-parse "$tag^{commit}")" = "$GITHUB_SHA"
