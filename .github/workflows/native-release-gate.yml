# SPDX-License-Identifier: GPL-3.0-or-later
name: Native boot release readiness (evidence, not OS publication)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: native-boot-readiness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-tests:
    name: Test native release evidence policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v4
      - name: Check syntax and fail-closed release policy
        run: |
          python3 -m py_compile scripts/native-release-gate.py tests/native-release-gate-test.py
          python3 tests/native-release-gate-test.py -v

  evidence:
    name: Capture read-only upstream evidence (report only)
    needs: offline-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v4
      - name: Collect upstream release and exact-source workflow status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p evidence
          # Blockers are an expected report result; this is not the strict gate.
          python3 scripts/native-release-gate.py --output evidence/native-release.json || true
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          report = json.load(open("evidence/native-release.json", encoding="utf-8"))
          print("## Native release readiness (report, not a successful OS boot)")
          print("**Gate:**", report["gate"])
          print("**Standalone OS qualified:**", report["standalone_os_qualified"])
          print("**Blockers:**")
          for blocker in report["blockers"]:
              print("- " + blocker)
          if not report["blockers"]:
              print("- None for the CI candidate gate; hardware/Setup still unqualified.")
          PY
      - name: Retain exact evidence snapshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: InfiltratorOS-native-boot-readiness-${{ github.sha }}
          path: evidence/native-release.json
          if-no-files-found: error
          retention-days: 30

  strict-candidate-gate:
    name: STRICT exact-source gate (manual; fails while blocked)
    if: github.event_name == 'workflow_dispatch'
    needs: offline-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v4
      - name: Reject missing or stale cross-repository release evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence
          python3 scripts/native-release-gate.py --output evidence/strict-candidate.json
      - name: Preserve the strict gate result even when blocked
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: InfiltratorOS-strict-native-release-gate-${{ github.sha }}
          path: evidence/strict-candidate.json
          if-no-files-found: warn
          retention-days: 30
