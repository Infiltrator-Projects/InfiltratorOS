name: Qualify independent FAT installation from OS bundle
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-filesystem-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Native bundle build prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-3-dev wget fontconfig binutils python3
      - name: Validate filesystem workers and build exact OS Debian
        run: |
          set -euo pipefail
          python3 tests/filesystem-install-test.py
          sh scripts/build-deb.sh
      - name: Install three independently published FAT modules through the sealed worker
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: sudo --preserve-env=GITHUB_TOKEN,GITHUB_ACTIONS python3 tests/filesystem-bundle-e2e.py dist/*.deb
