# SPDX-License-Identifier: GPL-3.0-or-later
# Decommission the wrongly scoped native root build; this push cancels the
# preceding long-running compilation in the same concurrency group.
name: Native InfiltratorFS root to installed PID1 VM qualification
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/native-root-handoff.yml
permissions:
  contents: read
concurrency:
  group: native-root-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cancel-obsolete-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - run: echo 'Obsolete cross-project kernel/InfiltratorFS compilation disabled.'
