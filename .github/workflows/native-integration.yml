name: Real native provider integration
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-provider-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: true
      - name: Prepare the disposable hosted build machine
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test -s /etc/apt/sources.list.d/ubuntu.sources
          printf '%s\n' 'Dir::Etc::sourcelist "/etc/apt/sources.list.d/ubuntu.sources";' 'Dir::Etc::sourceparts "-";' | sudo tee /etc/apt/apt.conf.d/99-infiltrator-ci-sources >/dev/null
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get install -y dpkg-repack pkg-config libcurl4-openssl-dev libjson-c-dev libssl-dev
      - name: Compile the production worker and snapshot verifier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-tools" "$RUNNER_TEMP/native-integration-logs"
          c++ -std=c++17 -O2 -Wall -Wextra -Werror -Wpedantic -pthread \
            $(pkg-config --cflags libcurl json-c openssl) -Isrc/infiltratr-common/include \
            packaging/native-component-worker.cpp \
            -o "$RUNNER_TEMP/native-tools/native-component-worker" \
            $(pkg-config --libs libcurl json-c openssl) -ldl
          c++ -std=c++17 -O2 -Wall -Wextra -Werror -Wpedantic \
            $(pkg-config --cflags libcurl json-c) packaging/native-release-snapshot.cpp \
            -o "$RUNNER_TEMP/native-tools/native-snapshot" $(pkg-config --libs libcurl json-c)
          cp packaging/filesystem-resources.json packaging/filesystem-additional.json \
             packaging/temporal-resources.json "$RUNNER_TEMP/native-tools/"
      - name: Install actual independent native filesystem and clock packages
        run: |
          sudo bash tests/native-live-integration.sh --disposable-ci \
            "$RUNNER_TEMP/native-tools" "$RUNNER_TEMP/native-integration-logs"
      - name: Retain actual scheduling and installation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-integration-logs
          path: ${{ runner.temp }}/native-integration-logs
          if-no-files-found: warn
