name: Reconcile retired InfiltratorOS branches once
on:
  push:
    branches: [main]
permissions:
  actions: read
  contents: write
  pull-requests: write
concurrency:
  group: infiltratoros-archive-retired-branches
  cancel-in-progress: false
jobs:
  archive-and-prune:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Archive qualified branch tips and retire stale refs
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          head_sha=$(gh api "repos/$repo/commits/main" --jq .sha)
          [[ "$head_sha" == "$EXPECTED_MAIN_SHA" ]] || exit 0
          # v1.0.56 is already published and both full integrations passed.
          # This maintenance commit may change only this one-shot workflow.
          qualified=$(gh api "repos/$repo/git/ref/tags/v1.0.56" --jq '.object.sha // empty')
          [[ "$qualified" == "5b6c72fa5df043e81318dc6eb35a8228c4b0c20b" ]] || exit 1
          changed=$(gh api "repos/$repo/compare/$qualified...$head_sha")
          jq -e '.status == "ahead" and (.files | length) == 1 and
                 .files[0].filename == ".github/workflows/reconcile-retired-branches.yml"'               <<<"$changed" >/dev/null
          runs=$(gh api "repos/$repo/actions/runs?head_sha=$qualified&per_page=50")
          for name in 'Build InfiltratorOS DEB' 'Qualify independent filesystem installation from OS bundle'; do
            jq -e --arg name "$name"               '[.workflow_runs[] | select(.name == $name and .conclusion == "success")] | length > 0'               <<<"$runs" >/dev/null
          done
          # A missing tag may produce a null JSON field; null is NOT a conflict.
          # Archive every exact reviewed tip before removing any branch.
          while IFS='|' read -r branch expected archive; do
            [[ -n "$branch" ]] || continue
            current=$(gh api "repos/$repo/git/ref/heads/$branch" --jq '.object.sha // empty' 2>/dev/null || :)
            [[ -n "$current" ]] || continue
            [[ "$current" == "$expected" ]] || { echo "::error::$branch moved"; exit 1; }
            # A missing Git ref can be serialized inconsistently by the
            # client; create first, then verify only if GitHub reports 422.
            if ! gh api -X POST "repos/$repo/git/refs" \
                -f "ref=refs/tags/$archive" -f "sha=$current" >/dev/null; then
              archived=$(gh api "repos/$repo/git/ref/tags/$archive" --jq '.object.sha // empty' 2>/dev/null || :)
              if [[ "$archived" != "$current" ]]; then
                echo "::error::Could not preserve $branch at $current"
                exit 1
              fi
            fi
            echo "Archived $branch at $current"
          done <<'BRANCHES'
          fix/forensic-installer-contracts-20261104|c8930437ed24b6f8cc67e7c93fd77f03dab6ef96|archive-20261104-infiltratoros-forensic
          fix/infiltratoros-doc-code-contracts-20261104|f57e78b9dba32012a13f039c5f1874759f7f1c0e|archive-20261104-infiltratoros-doc-code
          fix/native-progress-manifest-total-20261101|59b1dc2f38bbb36e96a6f1ab7a8412c6e0605663|archive-20261104-infiltratoros-progress
          fix/verify-ext2-test-media-abi-20261101|5cbdeb991a944f78ba1c4c5aede92c1fd3d32e69|archive-20261104-infiltratoros-ext2
          BRANCHES
          open=$(gh api "repos/$repo/pulls/21" --jq .state)
          if [[ "$open" == open ]]; then
            gh api -X PATCH "repos/$repo/pulls/21" -f state=closed >/dev/null
          fi
          while IFS='|' read -r branch expected; do
            [[ -n "$branch" ]] || continue
            current=$(gh api "repos/$repo/git/ref/heads/$branch" --jq '.object.sha // empty' 2>/dev/null || :)
            [[ -n "$current" ]] || continue
            [[ "$current" == "$expected" ]] || exit 1
            gh api -X DELETE "repos/$repo/git/refs/heads/$branch" >/dev/null
            echo "Retired $branch"
          done <<'BRANCHES'
          fix/forensic-installer-contracts-20261104|c8930437ed24b6f8cc67e7c93fd77f03dab6ef96
          fix/infiltratoros-doc-code-contracts-20261104|f57e78b9dba32012a13f039c5f1874759f7f1c0e
          fix/native-progress-manifest-total-20261101|59b1dc2f38bbb36e96a6f1ab7a8412c6e0605663
          fix/verify-ext2-test-media-abi-20261101|5cbdeb991a944f78ba1c4c5aede92c1fd3d32e69
          BRANCHES
